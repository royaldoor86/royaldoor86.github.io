<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>

        nav { background: rgba(0,0,0,0.9); padding: 15px; display: flex; justify-content: center; gap: 10px; border-bottom: 1px solid #f3cf7a; }
        nav a { color: white; text-decoration: none; padding: 8px 15px; }

        .card { background: rgba(255,255,255,0.05); border: 1px solid #f3cf7a; border-radius: 20px; padding: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }

<body>
    <nav>
