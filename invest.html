<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الأستثمار الملكي | Royal Door</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #050010; color: white; text-align: center; margin: 0; }
        #particles-js { position: fixed; width: 100%; height: 100%; z-index: 1; }
        .container { position: relative; z-index: 10; max-width: 1000px; margin: auto; padding: 40px 10px; }
        .invest-box { background: rgba(255,255,255,0.05); padding: 25px; border-radius: 30px; border: 1px solid #f3cf7a; backdrop-filter: blur(10px); }
        input { width: 80%; padding: 15px; border-radius: 15px; border: 2px solid #f3cf7a; background: #000; color: white; text-align: center; margin-bottom: 20px; font-size: 1.2rem; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { background: #f3cf7a; color: black; padding: 15px; }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .btn-go { background: #f3cf7a; color: black; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .back-link { display: inline-block; margin-top: 30px; color: #f3cf7a; text-decoration: none; font-weight: bold; font-size: 1.2rem; border: 1px solid #f3cf7a; padding: 10px 30px; border-radius: 50px; }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div class="container">
        <h1 style="color:#f3cf7a">📈 نظام الأستثمار الملكي (النجوم)</h1>
        <div class="invest-box">
            <p style="color:#00ff88">"حوّل نجومك إلى أرباح حقيقية بضمانة Royal Door"</p>
            <input type="number" id="invId" placeholder="أدخل الآيدي (ID) لتفعيل الباقة">
            <div style="overflow-x:auto">
                <table id="iTable"></table>
            </div>
        </div>
        <a href="index.html" class="back-link">← العودة للرئيسية</a>
    </div>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {"particles":{"number":{"value":80},"color":{"value":"#f3cf7a"},"shape":{"type":"circle"},"opacity":{"value":0.5},"size":{"value":3},"line_linked":{"enable":true,"distance":150,"color":"#f3cf7a","opacity":0.2},"move":{"enable":true,"speed":2}}});
        
        const data = [
            ["🌟 الدر","100,000","66.7$","1,900","40,400"],
            ["🔴 المرجان","200,000","133.3$","3,800","80,800"],
            ["🟤 العقيق","300,000","200.0$","5,700","120,700"],
            ["💠 الكريستال","500,000","333.3$","9,600","201,600"],
            ["🟢 الزبرجد","750,000","500.0$","14,400","302,400"],
            ["🤍 اللؤلؤ","1,000,000","666.7$","19,200","404,200"],
            ["🔷 الفيروز","1,200,000","800.0$","23,000","485,000"],
            ["💎 الماس","1,300,000","866.7$","25,000","525,000"],
            ["🟩 الزمرد","1,400,000","933.3$","27,000","565,000"],
            ["🔶 الياقوت","1,500,000","1000.0$","29,000","606,000"]
        ];

        document.getElementById('iTable').innerHTML = `<tr><th>الباقة</th><th>دينار</th><th>دولار</th><th>الربح</th><th>الإجمالي</th><th>تفعيل</th></tr>` + 
            data.map(r => `<tr><td style="color:#f3cf7a">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td style="color:#00ff88">+${r[3]}</td><td>${r[4]}</td><td><button class="btn-go" onclick="sendInv('${r[0]}','${r[1]}')">تفعيل</button></td></tr>`).join('');

        function sendInv(pkg, price) {
            const id = document.getElementById('invId').value;
            if(!id) { alert("❌ اكتب الآيدي أولاً!"); return; }
            const msg = `طلب استثمار:\nباقة: ${pkg}\nالسعر: ${price}\nالآيدي: ${id}`;
            window.open(`https://wa.me/9647770992966?text=${encodeURIComponent(msg)}`);
        }
    </script>
</body>
</html>
