<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Door - المنصة الملكية</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="background-overlay"></div>

    <header>
        <nav>
            <ul>
                <li><a href="#">الرئيسية</a></li>
                <li><a href="#">مركز شحني</a></li>
                <li><a href="#">مركز الشحن الملكي</a></li>
                <li><a href="#">سياسة الخصوصية</a></li>
                <li><a href="#">الدعم الفني</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="logo-section">
            <img src="crown-icon.png" alt="Crown" class="crown">
            <h1>Royal Door</h1>
            <h2>مرحباً بك في <span>ROYAL DOOR</span></h2>
            <p>منصة اجتماعية ملكية متكاملة</p>
        </div>

        <div class="features-badge">
            <span>غرف صوتية • ألعاب • هدايا يومية • شحن ملكي</span>
        </div>

        <div class="video-placeholder">
            <button class="play-button">▶</button>
        </div>

        <div class="action-buttons">
            <a href="#" class="btn-primary">تحميل التطبيق الآن</a>
            <a href="#" class="btn-secondary">تواصل مع الدعم الملكي</a>
            <a href="#" class="btn-outline">زيارة متجر الشحن</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Royal Door - Designed by Amjad Hadi</p>
    </footer>

</body>
</html>
