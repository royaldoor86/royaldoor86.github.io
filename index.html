<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Door | الواجهة الملكية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #f3cf7a; --glass: rgba(255, 255, 255, 0.05); }
        body, html { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background: #050010; color: white; overflow-x: hidden; transition: 0.5s; }
        #particles-js { position: fixed; width: 100%; height: 100%; z-index: 1; top: 0; left: 0; }
        .main-content { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; padding-top: 100px; padding-bottom: 50px; text-align: center; }
        
        /* إضافات جديدة */
        .stats-box { display: flex; gap: 30px; margin: 20px; }
        .stat-item { background: var(--glass); padding: 15px; border-radius: 10px; border: 1px solid var(--gold); }
        .slider-box { width: 90%; max-width: 600px; margin: 20px 0; padding: 20px; background: var(--glass); border-radius: 20px; }
        
        /* التعديلات المطلوبة */
        .video-box { width: 90%; max-width: 750px; aspect-ratio: 16/9; border: 3px solid var(--gold); border-radius: 25px; overflow: hidden; margin: 25px 0; }
        .social-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 15px; width: 90%; max-width: 800px; margin: 40px 0; }
        .social-card { background: var(--glass); border: 1px solid var(--gold); padding: 15px; border-radius: 15px; text-decoration: none; color: white; display: flex; flex-direction: column; align-items: center; transition: 0.3s; }
        .social-card i { font-size: 25px; margin-bottom: 5px; color: var(--gold); }
        
        nav { background: rgba(0,0,0,0.85); padding: 15px; position: fixed; top: 0; width: 100%; z-index: 1000; display: flex; justify-content: center; gap: 10px; border-bottom: 1px solid var(--gold); backdrop-filter: blur(10px); }
        nav a { color: white; text-decoration: none; padding: 8px 15px; }
    </style>
</head>
<body>

        <div class="stats-box">

            <a href="https://www.tiktok.com/@royaldoor86" class="social-card"><i class="fab fa-tiktok"></i> تيكتوك</a>
        </div>
    </div>

    <script>
        // تبديل اللغة
        function toggleLang() {
            const html = document.getElementById('html-root');
            if(html.dir === 'rtl') {
                html.dir = 'ltr';
                html.lang = 'en';
            } else {
                html.dir = 'rtl';
                html.lang = 'ar';
            }
        }
        // محاكاة الإحصائيات الحية
        setInterval(() => {
            document.getElementById('users').innerText = Math.floor(Math.random() * 1000) + 50000;
        }, 3000);
    </script>
