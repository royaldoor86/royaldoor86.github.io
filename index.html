<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Door | الواجهة الملكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #f3cf7a; --glass: rgba(255, 255, 255, 0.07); }
        body, html { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background: #050010; color: white; overflow-x: hidden; }
        
        /* الخلفية الكونية المتحركة */
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        
        nav { background: rgba(0,0,0,0.85); padding: 15px; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: center; gap: 10px; border-bottom: 1px solid var(--gold); backdrop-filter: blur(10px); }
        nav a { color: white; text-decoration: none; font-weight: bold; padding: 8px 15px; border-radius: 20px; transition: 0.3s; font-size: 0.9rem; }
        nav a:hover { background: var(--gold); color: black; }

        .hero { display: flex; flex-direction: column; align-items: center; padding: 40px 20px; z-index: 10; position: relative; }
        h1 { font-size: 4rem; font-weight: 900; background: linear-gradient(to bottom, #f3cf7a, #b08d32); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; }
        
        .video-box { width: 100%; max-width: 750px; aspect-ratio: 16/9; border: 3px solid var(--gold); border-radius: 25px; overflow: hidden; box-shadow: 0 0 30px rgba(243,207,122,0.3); margin: 25px 0; }

        /* روابط السياسات بشكل أفقي */
        .policy-links { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; }
        .policy-links a { color: #ccc; text-decoration: none; font-size: 0.85rem; border-bottom: 1px solid transparent; transition: 0.3s; }
        .policy-links a:hover { color: var(--gold); border-bottom-color: var(--gold); }

        .btn-download { background: linear-gradient(135deg, #f3cf7a, #b08d32); color: black; padding: 15px 45px; border-radius: 50px; text-decoration: none; font-weight: 900; font-size: 1.2rem; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }

        /* أيقونات التواصل الاجتماعي الجمالية */
        .social-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; width: 100%; max-width: 800px; margin-top: 40px; }
        .social-item { background: var(--glass); border: 1px solid rgba(243,207,122,0.2); padding: 15px; border-radius: 20px; text-decoration: none; color: white; transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .social-item:hover { transform: translateY(-5px); background: rgba(243,207,122,0.1); border-color: var(--gold); }
        .social-item img { width: 40px; height: 40px; }
    </style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
    particlesJS("canvas-container", {
        "particles": {
            "number": { "value": 100 },
            "color": { "value": "#f3cf7a" },
            "shape": { "type": "circle" },
            "opacity": { "value": 0.5, "random": true },
            "size": { "value": 3, "random": true },
            "line_linked": { "enable": true, "distance": 150, "color": "#f3cf7a", "opacity": 0.2, "width": 1 },

        },

    });
