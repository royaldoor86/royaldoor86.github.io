<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RPJJR3W8WT"></script>

    <meta charset="UTF-8">

    <title>مركز الشحن الملكي | Royal Door</title>

    <link rel="canonical" href="https://royaldoor.live/recharge.html">

    <meta name="description"
          content="مركز الشحن الملكي في Royal Door. اشحن الجواهر والكوينز بسهولة وسرعة.">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap"

    <style>
        :root {
            --gold: #f3cf7a;
            --gold-dark: #b08d32;
            --glass: rgba(255, 255, 255, 0.05);
            --green: #25d366;
            --bg: #050010;
        }

        * {
            box-sizing: border-box;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: white;
            overflow-x: hidden;
        }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: 1;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 950px;
            margin: auto;
            padding: 40px 15px;
        }

        .main-card {
            background: var(--glass);
            border: 2px solid var(--gold);
            border-radius: 35px;
            padding: 30px;
            backdrop-filter: blur(15px);
            box-shadow: 0 0 40px rgba(243, 207, 122, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(
                to bottom,
                #f3cf7a,
                #b08d32
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }

        .notice-box {
            background: rgba(243, 207, 122, 0.1);
            border: 1px solid var(--gold);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            color: var(--gold);
            text-align: justify;
            line-height: 1.8;
        }

        .id-section {
            background: rgba(243, 207, 122, 0.05);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 30px;
            border: 1px dashed var(--gold);
        }

        .id-section p {
            margin-top: 0;
            font-weight: bold;
            color: var(--gold);
        }

        input {
            width: 90%;
            max-width: 400px;
            padding: 18px;
            border-radius: 15px;
            border: 2px solid var(--gold);
            background: #000;
            color: #fff;
            font-size: 1.3rem;
            text-align: center;
            font-weight: bold;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            box-shadow: 0 0 15px rgba(243, 207, 122, 0.35);
        }

        input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .tabs {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 40px;
            border: 2px solid var(--gold);
            background: transparent;
            color: white;
            cursor: pointer;
            border-radius: 50px;
            font-weight: 900;
            font-size: 1.1rem;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
        }

        .tab-btn:hover {
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: var(--gold);
            color: black;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
            background: rgba(0,0,0,0.3);
        }

        th {
            background: var(--gold);
            color: black;
            padding: 18px;
            font-size: 1.1rem;
        }

        td {
            padding: 18px;
            border-bottom: 1px solid rgba(243, 207, 122, 0.1);
            font-size: 1.1rem;
            font-weight: bold;
        }

        .amount {
            color: var(--gold);
        }

        .price-iqd {
            color: white;
        }

        .price-usd {
            color: rgba(255,255,255,0.65);
            font-size: 0.95rem;
        }

        .btn-whatsapp {
            background: var(--green);
            color: white;
            padding: 10px 25px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
        }

        .btn-whatsapp:hover {
            transform: scale(1.08);
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.5);
        }

        .price-info {
            margin: 20px auto 25px;
            padding: 12px 20px;
            border: 1px solid rgba(243,207,122,0.5);
            background: rgba(243,207,122,0.06);
            border-radius: 15px;
            color: var(--gold);
            max-width: 650px;
            font-weight: bold;
        }

        .help-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 60px;
            height: 60px;
            background: var(--gold);
            color: var(--bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(243, 207, 122, 0.4);
            z-index: 1000;
            transition: 0.3s;
        }

        .help-btn:hover {
            transform: scale(1.1) rotate(20deg);
        }

        .back-home {
            display: inline-block;
            margin-top: 35px;
            color: var(--gold);
            text-decoration: none;
            font-weight: 900;
            font-size: 1.2rem;
            border: 2px solid var(--gold);
            padding: 12px 40px;
            border-radius: 50px;
            transition: 0.3s;
        }

        .back-home:hover {
            background: var(--gold);
            color: black;
        }

        @media (max-width: 600px) {

            .container {
                padding: 20px 10px;
            }

            .main-card {
                padding: 20px 12px;
                border-radius: 25px;
            }

            h1 {
                font-size: 2rem;
            }

            .tab-btn {
                padding: 10px 25px;
                font-size: 1rem;
            }

            td,
            th {
                padding: 14px 10px;
                font-size: 0.95rem;
            }

            .help-btn {
                width: 50px;
                height: 50px;
                left: 20px;
                bottom: 20px;
            }
        }
    </style>

<body>

<div id="particles-js"></div>

<div class="container">

    <div class="main-card">

        <h1>💎 مركز الشحن الملكي</h1>

        <div class="notice-box">
            <strong>💡 الشحن الملكي</strong><br>
            اختر نوع الرصيد الذي ترغب بشحنه، ثم اختر الكمية المناسبة.
            بعد ذلك أدخل الآيدي الخاص بحسابك لإرسال طلب الشحن.
            تأكد من صحة الآيدي قبل إرسال الطلب.
        </div>

        <div class="id-section">

            <p>
                خطوة هامة: أدخل الآيدي (ID) الخاص بك في التطبيق أولاً
            </p>

            <input
                type="number"
                id="user-id"
                placeholder="ID الحساب"
                inputmode="numeric"
            >

        </div>

        <div class="tabs">

            <button
                id="tabG"
                class="tab-btn active"
                onclick="showTab('gems')"
            >
                الجواهر 💎
            </button>

            <button
                id="tabC"
                class="tab-btn"
                onclick="showTab('coins')"
            >
                الكوينز 💰
            </button>

        </div>

        <div class="price-info" id="price-info">
            💎 كل 500 جوهرة = 1,500 دينار
        </div>

        <div class="table-wrapper">

            <table id="recharge-table"></table>

        </div>

        <a
            href="guide.html"
            class="help-btn"
            title="دليل الإرشادات"
        >
            ؟
        </a>

        <a
            href="index.html"
            class="back-home"
        >
            🏠 العودة للرئيسية
        </a>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<script>

    /*
    =====================================================
    إعدادات الأسعار
    =====================================================

    الجواهر:
    500 جوهرة = 1,500 دينار

    الكوينز:
    1,000 كوينز = 1,500 دينار

    إذا أردت تغيير الأسعار مستقبلاً،
    غيّر هذه القيم فقط.
    =====================================================
    */

    const PRICING = {

        gems: {
            baseAmount: 500,
            basePrice: 1500,
            symbol: "💎",
            name: "جوهرة"
        },

        coins: {
            baseAmount: 1000,
            basePrice: 1500,
            symbol: "💰",
            name: "كوينز"
        }

    };


    /*
    =====================================================
    الكميات التي تظهر للمستخدم
    =====================================================
    */

    const GEM_AMOUNTS = [
        500,
        1000,
        2500,
        5000,
        10000,
        20000,
        30000,
        50000,
        100000,
        150000,
        200000,
        500000,
        1000000
    ];


    const COIN_AMOUNTS = [
        1000,
        2000,
        5000,
        10000,
        20000,
        40000,
        50000,
        100000,
        200000,
        500000,
        1000000
    ];


    /*
    =====================================================
    حساب السعر تلقائياً
    =====================================================
    */

    function calculatePrice(type, amount) {

        const pricing = PRICING[type];

        return (amount / pricing.baseAmount) * pricing.basePrice;

    }


    /*
    =====================================================
    تنسيق الأرقام
    =====================================================
    */

    function formatNumber(number) {

        return Number(number).toLocaleString('en-US');

    }


    /*
    =====================================================
    حساب الدولار للعرض فقط
    =====================================================

    السعر المعروض بالدولار:
    1 دولار = 1,500 دينار

    إذا أردت تغيير سعر الدولار مستقبلاً
    غيّر هذا المتغير.
    =====================================================
    */

    const USD_RATE = 1500;


    function calculateUSD(price) {

        return price / USD_RATE;

    }


    /*
    =====================================================
    عرض الجدول
    =====================================================
    */

    function showTab(type) {

        const pricing = PRICING[type];

        const data =
            type === 'gems'
                ? GEM_AMOUNTS
                : COIN_AMOUNTS;

        const icon = pricing.symbol;

        const label = type === 'gems'
            ? 'جواهر'
            : 'كوينز';


        /*
        تغيير شكل الأزرار
        */

        document.getElementById('tabG').className =
            type === 'gems'
                ? 'tab-btn active'
                : 'tab-btn';

        document.getElementById('tabC').className =
            type === 'coins'
                ? 'tab-btn active'
                : 'tab-btn';


        /*
        تغيير ملاحظة السعر
        */

        if (type === 'gems') {

            document.getElementById('price-info').innerHTML =
                '💎 كل 500 جوهرة = 1,500 دينار';

        } else {

            document.getElementById('price-info').innerHTML =
                '💰 كل 1,000 كوينز = 1,500 دينار';

        }


        /*
        إنشاء الجدول
        */

        let html = `

            <tr>

                <th>الكمية</th>

                <th>بالدينار</th>

                <th>بالدولار</th>

                <th>طلب شحن</th>

            </tr>

        `;


        data.forEach(function(amount) {

            const price =
                calculatePrice(type, amount);

            const usd =
                calculateUSD(price);


            html += `

                <tr>

                    <td class="amount">
                        ${icon}
                        ${formatNumber(amount)}
                    </td>

                    <td class="price-iqd">
                        ${formatNumber(price)} IQD
                    </td>

                    <td class="price-usd">
                        $${usd.toFixed(2)}
                    </td>

                    <td>

                        <button
                            class="btn-whatsapp"
                            onclick="sendOrder(
                                '${label}',
                                '${amount}',
                                '${price}'
                            )"
                        >
                            شحن الآن
                        </button>

                    </td>

                </tr>

            `;

        });


        document.getElementById(
            'recharge-table'
        ).innerHTML = html;

    }


    /*
    =====================================================
    إرسال طلب الشحن إلى واتساب
    =====================================================
    */

    function sendOrder(type, amount, price) {

        const userId =
            document.getElementById('user-id');


        if (!userId.value) {

            userId.style.borderColor = "red";

            alert(
                "⚠️ يرجى كتابة الآيدي الخاص بك أولاً!"
            );

            userId.focus();

            return;

        }


        userId.style.borderColor =
            "var(--gold)";


        const message =

            `طلب شحن Royal Door\n\n` +

            `النوع: ${type}\n` +

            `الكمية: ${formatNumber(amount)}\n` +

            `السعر: ${formatNumber(price)} دينار\n` +

            `الآيدي: ${userId.value}`;


        window.open(

            `https://wa.me/9647770992966?text=${encodeURIComponent(message)}`,

            '_blank'

        );

    }


    /*
    =====================================================
    تشغيل الصفحة على الجواهر عند فتحها
    =====================================================
    */

    showTab('gems');


    /*
    =====================================================
    خلفية الجزيئات
    =====================================================
    */

    particlesJS(
        "particles-js",
        {
            "particles": {

                "number": {
                    "value": 80
                },

                "color": {
                    "value": "#f3cf7a"
                },

                "shape": {
                    "type": "circle"
                },

                "opacity": {
                    "value": 0.5
                },

                "size": {
                    "value": 3
                },

                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#f3cf7a",
                    "opacity": 0.2
                },

                "move": {
                    "enable": true,
                    "speed": 2
                }

            }
        }
    );

</script>

</body>
</html>
