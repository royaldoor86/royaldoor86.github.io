<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مركز الشحن الملكي</title>
  <style>
    body { margin: 0; min-height: 100vh; font-family: sans-serif; background: radial-gradient(circle at top left, #ff6ddd, #7b1fff 35%, #2d0055 100%); display: flex; align-items: center; justify-content: center; padding: 20px; color: #fff; }
    .card { width: 100%; max-width: 620px; background: linear-gradient(160deg, rgba(18,0,40,.95), rgba(40,0,90,.95)); border-radius: 36px; padding: 30px; text-align: center; box-shadow: 0 35px 90px rgba(0,0,0,.65); }
    h2 { color: #ffd54f; margin-bottom: 25px; }
    .package { background: rgba(255,255,255,.08); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,.2); margin-bottom: 20px; }
    .btn-buy { background: linear-gradient(135deg, #ff4fd8, #ff9100); color: #1b0030; padding: 12px 30px; border-radius: 999px; text-decoration: none; font-weight: 900; display: inline-block; margin-top: 15px; }
    .back { color: #e2d4ff; text-decoration: none; display: block; margin-top: 20px; opacity: 0.8; }
  </style>
</head>
<body>
  <div class="card">
    <h2>💎 مركز الشحن الملكي</h2>
    <div class="package">
      <h3>الباقة الملكية</h3>
      <p>1,300,000 جوهرة</p>
      <p>ربح شهري: 200,000 جوهرة</p>
      <a href="support.html" class="btn-buy">اطلب الشحن الآن</a>
    </div>
    <a href="index.html" class="back">← العودة للرئيسية</a>
  </div>
</body>
</html>
