<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مركز الشحن الملكي - Royal Door</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #121921;
      --card-bg: #1c2631;
      --accent-yellow: #f8cc3d;
      --accent-gray: #778593;
      --highlight: rgba(255,255,255,0.05);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Tajawal", sans-serif;
      background-color: var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .app-screen {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      background: var(--bg-dark);
      border-radius: 36px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 30px rgba(0,0,0,0.5);
    }

    /* القائمة العلوية */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      background-color: rgba(255,255,255,0.02);
    }

    .top-bar-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-gray);
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 15px 0;
      color: var(--accent-gray);
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .tab.active {
      color: var(--accent-yellow);
      border-bottom: 3px solid var(--accent-yellow);
    }

    /* لوحة الأرصدة (محاكاة) */
    .balances-wrapper {
      display: flex;
      padding: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .balance-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .balance-count {
      font-size: 18px;
      font-weight: 900;
      margin-top: 5px;
    }

    /* الحاوية السفلية للدفع */
    .payment-container {
      flex: 1;
      background-color: var(--card-bg);
      border-top-left-radius: 30px;
      border-top-right-radius: 30px;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .payment-title {
      color: var(--accent-yellow);
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .purchase-details {
      color: var(--accent-gray);
      font-size: 14px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* خيارات الدفع (السوق) */
    .payment-options {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .payment-option {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 15px;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      cursor: pointer;
    }

    .payment-option:hover {
      background: var(--highlight);
    }

    .option-info {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      color: #fff;
    }

    .option-name {
      font-weight: 700;
      font-size: 15px;
    }

    .option-number {
      font-size: 13px;
      color: var(--accent-gray);
    }

    .back-home {
      display: block;
      margin-top: auto;
      text-align: center;
      color: var(--accent-gray);
      text-decoration: none;
      font-size: 14px;
      padding: 15px;
    }

  </style>
</head>
<body>
  <div class="app-screen">
    <div class="top-bar">
      <span>→</span>
      <span class="top-bar-title">مركز الشحن الملكي</span>
      <span>...</span>
    </div>

    <div class="tabs">
      <div class="tab">شحن كوينز</div>
      <div class="tab active">شحن جواهر</div>
    </div>

    <div class="balances-wrapper">
      <div class="balance-box">
        <span style="font-size: 24px;">⭐</span>
        <span class="balance-count">790</span>
      </div>
      <div style="width: 1px; background-color:rgba(255,255,255,0.05);"></div>
      <div class="balance-box">
        <span style="font-size: 24px;">💎</span>
        <span class="balance-count">14281</span>
      </div>
    </div>

    <div class="payment-container">
      <div class="payment-title">اختر وسيلة الدفع الملكية</div>
      
      <div class="purchase-details">
        <span>⭐</span>
        لشراء 2000 كوينز بمبلغ 1.0 نجمة
      </div>

      <div class="payment-options">
        
        <a href="support.html" class="payment-option">
          <span>‹</span>
          <div class="option-info">
            <span class="option-name">زين كاش (Zain Cash)</span>
            <span class="option-number">07855900447</span>
          </div>
          <span style="font-size: 24px;">💳</span>
        </a>

        <a href="support.html" class="payment-option">
          <span>‹</span>
          <div class="option-info">
            <span class="option-name">آسيا باي (AsiaPay)</span>
            <span class="option-number">07770992966</span>
          </div>
          <span style="font-size: 24px;">👛</span>
        </a>

        <a href="support.html" class="payment-option">
          <span>‹</span>
          <div class="option-info">
            <span class="option-name">رصيد آسيا سيل / زين</span>
            <span class="option-number">تحويل رصيد</span>
          </div>
          <span style="font-size: 24px;">📱</span>
        </a>

        <a href="support.html" class="payment-option">
          <span>‹</span>
          <div class="option-info">
            <span class="option-name">ماستر كارد / فيزا / كي كارد</span>
            <span class="option-number">910113911184</span>
          </div>
          <span style="font-size: 24px;">🌐</span>
        </a>

      </div>

      <a href="index.html" class="back-home">العروض الحالية (السوق)</a>
    </div>
  </div>
</body>
</html>
