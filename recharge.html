<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مركز الشحن الملكي - Royal Door</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Tajawal", sans-serif;
      background: radial-gradient(circle at top left, #ff6ddd, #7b1fff 35%, #2d0055 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }
    .card {
      width: 100%;
      max-width: 620px;
      background: linear-gradient(160deg, rgba(18,0,40,.95), rgba(40,0,90,.95));
      border-radius: 36px;
      padding: 30px;
      box-shadow: 0 35px 90px rgba(0,0,0,.65);
      text-align: center;
    }
    h2 { color: #ffd54f; margin-bottom: 20px; }
    .package {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.2);
      padding: 15px;
      border-radius: 20px;
      margin-bottom: 15px;
    }
    .btn-buy {
      background: linear-gradient(135deg, #ff4fd8, #ff9100);
      color: #1b0030;
      padding: 10px 20px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 900;
      display: inline-block;
      margin-top: 10px;
    }
    .back-link { color: #d1c4ff; text-decoration: none; display: block; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>💎 مركز الشحن الملكي</h2>
    
    <div class="package">
      <h3>الباقة الملكية المميزة</h3>
      <p>احصل على 1,300,000 جوهرة</p>
      <p>ربح شهري متوقع: 200,000 جوهرة</p>
      <a href="support.html" class="btn-buy">اطلب الشحن الآن</a>
    </div>

    <a href="index.html" class="back-link">← العودة للرئيسية</a>
  </div>
</body>
</html>
