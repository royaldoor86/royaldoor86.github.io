<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مركز الشحن الملكي</title>
  <style>
    body { background: #121921; color: #fff; font-family: sans-serif; padding: 20px; }
    .card { max-width: 500px; margin: auto; background: #1c2631; padding: 20px; border-radius: 20px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th, td { padding: 10px; border-bottom: 1px solid #333; text-align: center; }
    .btn-buy { background: #f8cc3d; color: #000; padding: 5px 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
    /* نافذة الدفع المخفية */
    #paymentModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
    .modal-content { background: #1c2631; padding: 20px; border-radius: 20px; width: 90%; max-width: 400px; }
    input, select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
  </style>
</head>
<body>

<div class="card">
  <h2>💎 اختر باقتك</h2>
  <table>
    <tr><th>الجواهر</th><th>السعر</th><th>شراء</th></tr>
    <tr><td>1,000</td><td>2$</td><td><button class="btn-buy" onclick="openModal('1000 جواهر - 2$')">شراء</button></td></tr>
    <tr><td>500,000</td><td>1000$</td><td><button class="btn-buy" onclick="openModal('500,000 جواهر - 1000$')">شراء</button></td></tr>
    </table>
</div>

<div id="paymentModal">
  <div class="modal-content">
    <h3>اختر وسيلة الدفع</h3>
    <select id="method" onchange="updateDetails()">
      <option value="زين كاش - 07855900447">زين كاش</option>
      <option value="آسيا باي - 07770992966">آسيا باي</option>
      <option value="رصيد (آسيا/زين)">رصيد (آسيا/زين)</option>
      <option value="ماستر/فيزا - 910113911184">بطاقة مصرفية</option>
    </select>
    <p id="accountDetails">رقم الحساب: 07855900447</p>
    <input type="text" id="senderName" placeholder="اسمك داخل اللعبة">
    <input type="text" id="transactionId" placeholder="رقم عملية التحويل أو تفاصيل البطاقة">
    <button class="btn-buy" onclick="sendToWhatsApp()">إرسال الطلب عبر واتساب</button>
    <button onclick="document.getElementById('paymentModal').style.display='none'">إغلاق</button>
  </div>
</div>

<script>
  let selectedPackage = "";
  function openModal(pkg) { selectedPackage = pkg; document.getElementById('paymentModal').style.display = 'flex'; }
  function updateDetails() { document.getElementById('accountDetails').innerText = "رقم الحساب: " + document.getElementById('method').value; }
  
  function sendToWhatsApp() {
    let method = document.getElementById('method').value;
    let name = document.getElementById('senderName').value;
    let trans = document.getElementById('transactionId').value;
    let msg = `طلب شحن جديد:%0Aالباقة: ${selectedPackage}%0Aالوسيلة: ${method}%0Aاسم اللاعب: ${name}%0Aرقم العملية/تفاصيل البطاقة: ${trans}`;
    window.open(`https://wa.me/9647855900447?text=${msg}`, '_blank');
  }
</script>

</body>
</html>
