<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز الشحن الملكي | Royal Door</title>
    <link rel="canonical" href="https://royaldoor.live/recharge.html" />
    <meta name="description" content="اشحن جواهر وكوينز Royal Door الملكية بأفضل الأسعار. آمن، سريع، ومباشر عبر واتساب.">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #f3cf7a; --glass: rgba(255, 255, 255, 0.05); }
        body, html { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background: #050010; color: white; overflow-x: hidden; }
        
        #particles-js { position: fixed; width: 100%; height: 100%; z-index: 1; top: 0; left: 0; }
        .container { position: relative; z-index: 10; max-width: 950px; margin: auto; padding: 40px 15px; }
        .main-card { background: var(--glass); border: 2px solid var(--gold); border-radius: 35px; padding: 30px; backdrop-filter: blur(15px); box-shadow: 0 0 40px rgba(243, 207, 122, 0.1); }
        
        h1 { font-size: 2.5rem; background: linear-gradient(to bottom, #f3cf7a, #b08d32); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 30px; }

        .id-section { background: rgba(243, 207, 122, 0.1); padding: 25px; border-radius: 20px; margin-bottom: 30px; border: 1px dashed var(--gold); }
        input { width: 90%; max-width: 400px; padding: 18px; border-radius: 15px; border: 2px solid var(--gold); background: #000; color: #fff; font-size: 1.3rem; text-align: center; font-weight: bold; outline: none; transition: 0.3s; }
        input:focus { box-shadow: 0 0 15px var(--gold); }

        .tabs { display: flex; gap: 15px; justify-content: center; margin-bottom: 25px; }
        .tab-btn { padding: 12px 40px; border: 2px solid var(--gold); background: transparent; color: white; cursor: pointer; border-radius: 50px; font-weight: 900; font-size: 1.1rem; transition: 0.3s; }
        .tab-btn.active { background: var(--gold); color: black; }

        .table-wrapper { overflow-x: auto; border-radius: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 650px; background: rgba(0,0,0,0.3); }
        th { background: var(--gold); color: black; padding: 18px; font-size: 1.1rem; }
        td { padding: 18px; border-bottom: 1px solid rgba(243, 207, 122, 0.1); font-size: 1.1rem; font-weight: bold; }
        tr:hover { background: rgba(243, 207, 122, 0.05); }

        .btn-whatsapp { background: #25d366; color: white; padding: 10px 25px; border-radius: 12px; text-decoration: none; font-weight: bold; border: none; cursor: pointer; transition: 0.3s; }
        .btn-whatsapp:hover { transform: scale(1.1); box-shadow: 0 0 20px #25d366; }

        .back-home { display: inline-block; margin-top: 35px; color: var(--gold); text-decoration: none; font-weight: 900; font-size: 1.2rem; border: 2px solid var(--gold); padding: 12px 40px; border-radius: 50px; }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div class="container">
        <div class="main-card">
            <h1>💎 مركز الشحن الملكي</h1>
            <div class="id-section">
                <p style="margin-top:0; font-weight:bold; color:var(--gold);">خطوة هامة: أدخل الآيدي (ID) الخاص بك في التطبيق أولاً</p>
                <input type="number" id="user-id" placeholder="ID الحساب">
            </div>
            <div class="tabs">
                <button id="tabG" class="tab-btn active" onclick="showTab('gems')">الجواهر 💎</button>
                <button id="tabC" class="tab-btn" onclick="showTab('coins')">الكوينز 💰</button>
            </div>
            <div class="table-wrapper"><table id="recharge-table"></table></div>
            <a href="index.html" class="back-home">🏠 العودة للرئيسية</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {"particles":{"number":{"value":80},"color":{"value":"#f3cf7a"},"shape":{"type":"circle"},"opacity":{"value":0.5},"size":{"value":3},"line_linked":{"enable":true,"distance":150,"color":"#f3cf7a","opacity":0.2},"move":{"enable":true,"speed":2}}});
        
        const gems = [[1000, "2,600", "2$"],[5000, "13,000", "10$"],[10000, "26,000", "20$"],[20000, "52,000", "40$"],[30000, "78,000", "60$"],[50000, "130,000", "100$"],[100000, "260,000", "200$"],[150000, "390,000", "300$"],[200000, "520,000", "400$"],[500000, "1,300,000", "1000$"],[1000000, "2,600,000", "2000$"]];
        const coins = [[2000, "1,500", "1$"],[4000, "3,000", "2$"],[10000, "7,500", "5$"],[20000, "15,000", "10$"],[40000, "30,000", "20$"],[100000, "75,000", "50$"],[200000, "150,000", "100$"],[1000000, "750,000", "500$"]];

        function showTab(type) {
            const data = (type === 'gems') ? gems : coins;
            const icon = (type === 'gems') ? '💎' : '💰';
            const label = (type === 'gems') ? 'جواهر' : 'كوينز';
            document.getElementById('tabG').className = (type === 'gems') ? 'tab-btn active' : 'tab-btn';
            document.getElementById('tabC').className = (type === 'coins') ? 'tab-btn active' : 'tab-btn';
            let html = `<tr><th>الكمية</th><th>بالدينار</th><th>بالدولار</th><th>طلب شحن</th></tr>`;
            data.forEach(row => { html += `<tr><td style="color:var(--gold)">${icon} ${row[0].toLocaleString()}</td><td>${row[1]} IQD</td><td>${row[2]}</td><td><button class="btn-whatsapp" onclick="sendOrder('${label}', '${row[0]}', '${row[1]}')">شحن الآن</button></td></tr>`; });
            document.getElementById('recharge-table').innerHTML = html;
        }

        function sendOrder(type, amount, price) {
            const userId = document.getElementById('user-id');
            if(!userId.value) { userId.style.borderColor = "red"; alert("⚠️ يرجى كتابة الآيدي الخاص بك أولاً!"); return; }
            userId.style.borderColor = "var(--gold)";
            window.open(`https://wa.me/9647770992966?text=${encodeURIComponent(`طلب شحن ${type} (${amount}) للسعر ${price} IQD، الآيدي: ${userId.value}`)}`, '_blank');
        }
        showTab('gems');
    </script>
</body>
</html>
