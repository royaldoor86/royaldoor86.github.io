<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مركز الشحن الملكي | Royal Door</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #0a0118; color: white; text-align: center; padding: 40px 10px; }
        .card { max-width: 900px; margin: auto; background: rgba(255,255,255,0.05); padding: 30px; border-radius: 30px; border: 1px solid #f3cf7a; }
        .input-group { background: rgba(243,207,122,0.1); padding: 20px; border-radius: 20px; margin-bottom: 30px; border: 1px dashed #f3cf7a; }
        input { width: 90%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #f3cf7a; background: #000; color: #fff; font-size: 1.1rem; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #f3cf7a; color: #000; padding: 15px; }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 1.1rem; }
        .btn-order { background: #25d366; color: white; padding: 8px 20px; border-radius: 10px; text-decoration: none; font-weight: bold; }
        .badge { background: #f3cf7a; color: #000; padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1 style="color:#f3cf7a">💎 مركز الشحن والتفعيل</h1>
        <div class="input-group">
            <p>يرجى إدخال البيانات المطلوبة لضمان سرعة التفعيل</p>
            <input type="text" id="uid" placeholder="أدخل الآيدي (ID) الخاص بالحساب">
            <input type="text" id="ucode" placeholder="أدخل كود البطاقة (إن وجد)">
        </div>

        <h2 id="title">باقات الجواهر الملكية</h2>
        <div style="overflow-x:auto">
            <table id="rechargeTable"></table>
        </div>
        <br>
        <button onclick="window.location.href='index.html'" style="color:gray; background:none; border:none; cursor:pointer;">← العودة للرئيسية</button>
    </div>

    <script>
        const data = [
            [1000,"2,600","2$"],[5000,"13,000","10$"],[10000,"26,000","20$"],[20000,"52,000","40$"],[30000,"78,000","60$"],[50000,"130,000","100$"],[100000,"260,000","200$"],[150000,"390,000","300$"],[200000,"520,000","400$"],[500000,"1,300,000","1000$"],[1000000,"2,600,000","2000$"]
        ];
        let html = `<tr><th>الكمية</th><th>دينار</th><th>دولار</th><th>تفعيل مباشر</th></tr>`;
        data.forEach(r => {
            html += `<tr><td>💎 ${r[0].toLocaleString()}</td><td>${r[1]}</td><td>${r[2]}</td><td><a href="https://wa.me/9647770992966" class="btn-order">اطلب الآن</a></td></tr>`;
        });
        document.getElementById('rechargeTable').innerHTML = html;
    </script>
</body>
</html>
