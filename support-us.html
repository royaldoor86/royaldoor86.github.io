<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قيمنا وادعمنا | Royale Dur</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* تصميم يحاكي ثيم التطبيق (الملكي والأسود) */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a1f1c; /* نفس لون خلفية التطبيق */
            background-image: radial-gradient(circle at center, #1a3a35 0%, #0a1f1c 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.05); /* تأثير Glassmorphism */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 30px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .icon-star {
            font-size: 80px;
            color: #d4af37; /* اللون الذهبي الملكي */
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        p {
            font-size: 16px;
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .rate-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #d4af37;
            color: #000;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .rate-button:hover {
            transform: scale(1.05);
            background-color: #f1c40f;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
        }

        .rate-button i {
            margin-left: 10px;
        }

        .footer-link {
            margin-top: 30px;
            font-size: 12px;
            color: #666;
        }
        
        .footer-link a {
            color: #d4af37;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <div class="icon-star">
            <i class="fas fa-star"></i>
        </div>
        
        <h1>هل تستمتع بـ رويال دور؟</h1>
        
        <p>
            دعمك لنا بالتقييم يساعدنا على تقديم الأفضل دائماً وتطوير ميزات ملكية جديدة تليق بك كعضو في مجتمعنا.
        </p>

        <!-- استبدل الرابط أدناه برابط تطبيقك على متجر جوجل بلاي -->
        <a href="https://play.google.com/store/apps/details?id=com.royaldoor.app" class="rate-button">
            قيمنا الآن على المتجر
            <i class="fas fa-star-half-alt"></i>
        </a>

        <div class="footer-link">
            <a href="index.html">العودة للرئيسية</a>
        </div>
    </div>

</body>
</html>
